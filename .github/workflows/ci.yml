name: CI

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    # Ubuntu runners default to C.UTF-8, but pin it explicitly: the test
    # suite compares German-language sector labels (ü, etc.) from
    # scripts/utils/sector_taxonomy.R, and a non-UTF-8 locale mangles those
    # comparisons (hit and fixed in the sandbox that built this workflow).
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        run: |
          install.packages(c(
            "testthat", "withr", "here",
            "tidyverse", "readxl", "writexl", "countrycode", "httr", "jsonlite"
          ))
        shell: Rscript {0}

      - name: Run tests
        run: Rscript tests/run_tests.R
